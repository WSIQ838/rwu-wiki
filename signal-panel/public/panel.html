<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RWU signal panel</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #ececec; font-family: system-ui, "Segoe UI", sans-serif; }
  body { display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 14px; padding: 8px 14px; background: #16181d; border-bottom: 1px solid #2a2d35; }
  header h1 { font-size: 17px; margin: 0; font-weight: 700; }
  header .by { color: #9aa0ac; font-size: 13px; }
  header .gap { flex: 1; }
  #status { font-size: 13px; color: #9aa0ac; }
  #status.late { color: #ffd828; }
  #status.lost { color: #ff6b6b; }
  button { background: #262a33; color: #ececec; border: 1px solid #3a3f4b; border-radius: 6px; padding: 6px 12px; font-size: 13px; cursor: pointer; }
  button:hover { background: #323744; }
  main { flex: 1; position: relative; min-height: 0; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #ask { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  #ask form { background: #16181d; border: 1px solid #2a2d35; border-radius: 10px; padding: 26px 30px; text-align: center; max-width: 420px; }
  #ask h2 { margin: 0 0 8px; font-size: 20px; }
  #ask p { margin: 0 0 16px; color: #9aa0ac; font-size: 14px; line-height: 1.45; }
  #ask input { font: 700 28px ui-monospace, Consolas, monospace; letter-spacing: 4px; text-transform: uppercase; text-align: center; width: 230px; padding: 8px;
    background: #000; color: #fff; border: 1px solid #3a3f4b; border-radius: 6px; }
  #ask .err { color: #ff6b6b; min-height: 20px; margin: 10px 0 0; font-size: 13px; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<header>
  <h1 id="name">RWU signal panel</h1>
  <span class="by" id="by"></span>
  <span class="gap"></span>
  <span id="status"></span>
  <button id="other" class="hidden" type="button">Another desk</button>
</header>
<main>
  <canvas id="c"></canvas>
  <div id="ask">
    <form id="form">
      <h2>Track diagram</h2>
      <p>In the game, sit at your signal box desk and press <b>2nd screen</b>. Type the code it shows.</p>
      <input id="code" maxlength="12" autocomplete="off" autofocus aria-label="Desk code">
      <p class="err" id="err"></p>
      <button type="submit">Show the diagram</button>
    </form>
  </div>
</main>
<script>
'use strict';
// Draws one signal box's track diagram from the plan and state the game sends (see rwu-signal-panel.mjs).
// It is the same drawing as the game's own panel (Client SignalerCTC _Redraw): thick grey track on a
// square grid, every slope at 45 degrees, a lamp per run of track (white = a train), green = a route set,
// blue = closed for maintenance, a gap in the leg a switch is NOT set for. It only shows.
const TRACK = 'rgb(182,182,182)', ROUTE = 'rgb(70,222,110)', OCC = '#fff', BLUE = 'rgb(70,150,255)';
const RED = 'rgb(232,30,30)', GRN = 'rgb(98,255,36)', YEL = 'rgb(255,216,40)', PURPLE = 'rgb(200,90,255)';
const PLAT = 'rgb(152,100,52)', LABEL = 'rgb(236,236,236)', LAMP_OFF = 'rgb(24,24,24)', RING = 'rgb(66,66,66)';
const MONO = 'ui-monospace, Consolas, "Courier New", monospace';

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let plan = null, state = null, rev = -1, code = '', lastOk = 0, age = 0, timer = null;

const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const pairs = (flat) => { const out = []; for (let i = 0; i + 1 < flat.length; i += 2) out.push([flat[i], flat[i + 1]]); return out; };

function draw() {
  const dpr = window.devicePixelRatio || 1;
  const cw = canvas.clientWidth, ch = canvas.clientHeight;
  if (canvas.width !== Math.round(cw * dpr) || canvas.height !== Math.round(ch * dpr)) {
    canvas.width = Math.round(cw * dpr);
    canvas.height = Math.round(ch * dpr);
  }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, cw, ch);
  if (!plan || !state) return;

  // fit the whole plan: one square is as wide as it is high
  let u0 = Infinity, u1 = -Infinity, r0 = Infinity, r1 = -Infinity;
  for (const t of plan.T) for (const [u, r] of pairs(t[1])) { u0 = Math.min(u0, u); u1 = Math.max(u1, u); r0 = Math.min(r0, r); r1 = Math.max(r1, r); }
  const tags = plan.G.length > 0, buffers = plan.P.some((p) => p[5] === 1);
  const cell = clamp(Math.min((cw - 60 - (tags ? 130 : 0) - (buffers ? 60 : 0)) / Math.max(u1 - u0, 1), (ch - 50) / Math.max(r1 - r0 + 1.8, 1)), 6, 120);
  const W = clamp(Math.round(cell * (plan.W || 0.3)), 3, 26);
  const cx = cw / 2 + ((buffers ? 60 : 0) - (tags ? 130 : 0)) / 2, cy = ch / 2;
  const su = (u0 + u1) / 2, sr = (r0 + r1) / 2;
  const P = (u, r) => [cx + (u - su) * cell, cy - (r - sr) * cell];
  const text = clamp(Math.floor(cell * 0.46), 10, 22);

  const occ = new Set(state.occ || []), route = new Set(state.route || []), blk = new Set(state.blk || []);
  const sw = new Map((state.sw || []).map((s) => [s[0], s]));
  const sig = new Map((state.sig || []).map((s) => [s[0], s]));
  const runLit = new Set();
  for (const t of plan.T) if (occ.has(t[0])) runLit.add(t[7]);
  const byId = new Map(plan.T.map((t) => [t[0], t]));

  // platforms: the brown block beside the track
  for (const p of plan.P) {
    const a = P(p[0], p[2]), b = P(p[1], p[2]);
    const margin = Math.max(6, W * 0.9), high = Math.max(cell - W - margin, 4);
    const y = a[1] - p[3] * cell / 2;
    ctx.fillStyle = PLAT;
    ctx.fillRect(Math.min(a[0], b[0]), y - high / 2, Math.abs(b[0] - a[0]), high);
    ctx.fillStyle = 'rgb(255,226,170)';
    ctx.textBaseline = 'middle';
    if (p[5] === 1) {
      const at = P(-0.6, p[2]);
      ctx.font = `700 ${clamp(Math.floor(cell * 0.52), 10, 24)}px ${MONO}`;
      ctx.textAlign = 'center';
      ctx.fillText(p[4], at[0], at[1]);
    } else if (Math.abs(b[0] - a[0]) > 36) {
      const size = clamp(Math.floor(high * 0.42), 9, 20);
      ctx.font = `700 ${size}px ${MONO}`;
      ctx.textAlign = 'center';
      ctx.fillText(p[4], Math.min(a[0], b[0]) + size + 2, a[1] - p[3] * (W / 2 + margin / 2 + size * 0.5 + 2));
    }
  }

  // track: plain blocks first, then the coloured ones over them
  const trim = Math.max(2, W * 0.28);
  const pixels = new Map();
  for (const t of plan.T) pixels.set(t[0], pairs(t[1]).map(([u, r]) => P(u, r)));
  const stroke = (t, colour) => {
    const pts = pixels.get(t[0]).map((p) => p.slice());
    const n = pts.length;
    const end = (i, j, gap) => {
      const dx = pts[j][0] - pts[i][0], dy = pts[j][1] - pts[i][1], len = Math.hypot(dx, dy);
      if (len < 0.01) return;
      const by = gap ? (len > trim * 2 + 2 ? trim : 0) : -0.6; // a gap stops short; a joined end overlaps a little
      pts[i][0] += dx / len * by; pts[i][1] += dy / len * by;
    };
    end(0, 1, t[2] === 1);
    end(n - 1, n - 2, t[3] === 1);
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < n; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.lineWidth = W; ctx.lineJoin = 'miter'; ctx.lineCap = 'butt'; ctx.strokeStyle = colour;
    ctx.stroke();
  };
  const colourOf = (t) => blk.has(t[0]) ? BLUE : (occ.has(t[0]) && t[6] === 1) ? OCC : route.has(t[0]) ? ROUTE : TRACK;
  for (const t of plan.T) if (colourOf(t) === TRACK) stroke(t, TRACK);
  for (const t of plan.T) if (colourOf(t) !== TRACK) stroke(t, colourOf(t));

  // (numbers and names are not written over each other: each goes in the first of its places that is free,
  // as on the game's own panel. The signal symbols take their places first.)
  const taken = [];
  const hits = (x0, y0, x1, y1) => taken.some((r) => x0 < r[2] && x1 > r[0] && y0 < r[3] && y1 > r[1]);
  const take = (x0, y0, x1, y1) => taken.push([x0, y0, x1, y1]);
  const sigGeo = (s) => {
    const at = P(s[1], s[2]), dir = s[3];
    const lampD = clamp(Math.round(W * 1.15), 8, 22), thin = Math.max(3, Math.round(W * 0.3)), stem = Math.max(6, Math.floor(lampD * 0.7));
    return { at, dir, lampD, thin, stem, y: at[1] + dir * (W / 2 + lampD / 2 + 3), reach: thin / 2 + stem + lampD - 2 };
  };
  for (const s of plan.S) {
    const g = sigGeo(s), xa = g.at[0] - g.dir * 2, xb = g.at[0] + g.dir * (g.reach + 1);
    take(Math.min(xa, xb), g.y - g.lampD / 2, Math.max(xa, xb), g.y + g.lampD / 2);
  }

  // switches: the gap in the leg not set, a line down a reversed leg, the lever number
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const x of plan.X) {
    const p = P(x[1], x[2]);
    const cur = sw.get(x[0]);
    const branch = cur ? cur[1] : '', lock = cur ? cur[2] : '';
    const legs = x[5].map((leg) => {
      const pts = pairs(leg[1]).map(([u, r]) => P(u, r));
      const out = { name: leg[0], out: pts[pts.length - 1][0] >= pts[0][0] ? 1 : -1 };
      for (let i = 0; i + 1 < pts.length; i++) {
        if (Math.abs(pts[i + 1][1] - pts[i][1]) > 0.5) { out.s0 = pts[i]; out.s1 = pts[i + 1]; out.far = Math.abs(pts[i][0] - p[0]); break; }
      }
      return out;
    });
    let nearest = Infinity;
    for (const l of legs) if (l.s0) nearest = Math.min(nearest, l.far);
    let at = p;
    for (const l of legs) if (l.s0 && l.far <= nearest + 0.01) at = l.s0;
    for (const l of legs) {
      const slopes = !!l.s0 && l.far <= nearest + 4;
      let s0, s1;
      if (slopes) { s0 = l.s0; s1 = l.s1; } else {
        const x0 = nearest < Infinity ? p[0] + l.out * nearest : p[0];
        s0 = [x0, p[1]]; s1 = [x0 + l.out * 40, p[1]];
      }
      const dx = s1[0] - s0[0], dy = s1[1] - s0[1], len = Math.hypot(dx, dy) || 1;
      const gl = Math.max(4, Math.round(W * 0.55));
      if (branch && branch !== l.name) {
        ctx.fillStyle = '#000';
        if (slopes && Math.abs(dy) > 0.5) {
          const v = W / 2 + gl / 2, gx = s0[0] + dx / Math.abs(dy) * v, gy = s0[1] + Math.sign(dy) * v, gw = W * 1.5 + 6;
          ctx.fillRect(gx - gw / 2, gy - gl / 2, gw, gl);
        } else {
          const gx = s0[0] + (dx >= 0 ? 1 : -1) * (W * 1.3 + 1 + gl / 2);
          ctx.fillRect(gx - gl / 2, s0[1] - (W + 2) / 2, gl, W + 2);
        }
      } else if (branch && branch === l.name && branch !== 'Normal') {
        const run = Math.max(Math.min(len, cell * 1.2), 14);
        ctx.beginPath();
        ctx.moveTo(s0[0], s0[1]);
        ctx.lineTo(s0[0] + dx / len * run, s0[1] + dy / len * run);
        ctx.lineWidth = Math.max(3, Math.floor(W * 0.3)); ctx.lineCap = 'butt';
        ctx.strokeStyle = lock === 'route' ? GRN : lock ? BLUE : YEL;
        ctx.stroke();
      }
    }
    ctx.fillStyle = LABEL;
    ctx.font = `${text}px ${MONO}`;
    ctx.textAlign = 'center';
    const off = x[4] * (W / 2 + text * 0.75), hw = x[3].length * text * 0.3 + 3, hh = text / 2 + 1;
    let px = at[0], py = at[1] - off;
    for (const [ox, oy] of [[0, -off], [0, off], [-18, -off], [18, -off], [-18, off], [18, off]]) {
      if (!hits(at[0] + ox - hw, at[1] + oy - hh, at[0] + ox + hw, at[1] + oy + hh)) { px = at[0] + ox; py = at[1] + oy; break; }
    }
    take(px - hw, py - hh, px + hw, py + hh);
    ctx.fillText(x[3], px, py);
  }

  // the lamp of each run of track
  const lampR = Math.max(5, W * 1.65 / 2);
  for (const t of plan.T) {
    if (t[4] === false || t[4] == null) continue;
    const at = P(t[4], t[5]);
    ctx.beginPath();
    ctx.arc(at[0], at[1], lampR - 1, 0, Math.PI * 2);
    ctx.fillStyle = runLit.has(t[7]) ? OCC : LAMP_OFF;
    ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = RING;
    ctx.stroke();
  }

  // signals: post, stem and lamp (the lamp ahead of the post the way trains pass it), and the name
  for (const pass of [1, 0]) {
    for (const s of plan.S) {
      if (s[5] !== pass) continue; // (the signals that have a lever get their names first)
      const { at, dir, lampD, thin, stem, y, reach } = sigGeo(s);
      ctx.fillStyle = TRACK;
      ctx.fillRect(at[0] - thin / 2, y - lampD / 2, thin, lampD);
      const sx = at[0] + dir * (thin / 2 + stem / 2);
      ctx.fillRect(sx - stem / 2, y - thin / 2, stem, thin);
      const cur = sig.get(s[0]);
      const aspect = cur ? cur[1] : null;
      ctx.beginPath();
      ctx.arc(at[0] + dir * (thin / 2 + stem + lampD / 2 - 2), y, lampD / 2, 0, Math.PI * 2);
      ctx.fillStyle = cur && cur[3] ? 'rgb(90,90,90)' : aspect === 'Stop' ? RED : (aspect == null || aspect === 'Clear') ? GRN : YEL;
      ctx.fill();
      if (cur && cur[2]) { ctx.lineWidth = 2; ctx.strokeStyle = PURPLE; ctx.stroke(); }
      const size = s[5] === 1 ? text : Math.max(9, text - 3);
      ctx.font = `${size}px ${MONO}`;
      const w = s[4].length * size * 0.6 + 4, hh = size / 2 + 1;
      let placed = null;
      for (const side of [1, -1]) {
        const x0 = side === 1 ? at[0] + dir * (reach + 4) : at[0] - dir * 7, grow = dir * side;
        const xa = Math.min(x0, x0 + grow * w), xb = Math.max(x0, x0 + grow * w);
        if (!hits(xa, y - hh, xb, y + hh)) { placed = [x0, grow, xa, xb]; break; }
      }
      if (!placed && s[5] === 1) { // (no free place for a lever's name: it keeps its usual one)
        const x0 = at[0] + dir * (reach + 4);
        placed = [x0, dir, Math.min(x0, x0 + dir * w), Math.max(x0, x0 + dir * w)];
      }
      if (placed) {
        take(placed[2], y - hh, placed[3], y + hh);
        ctx.fillStyle = s[5] === 1 ? LABEL : 'rgb(170,170,170)';
        ctx.textAlign = placed[1] > 0 ? 'left' : 'right';
        ctx.fillText(s[4], placed[0], y);
      }
    }
  }

  // where each line goes
  ctx.textAlign = 'left'; ctx.fillStyle = LABEL; ctx.font = `${text}px ${MONO}`;
  for (const g of plan.G) { const at = P(g[0], g[1]); ctx.fillText('○ ' + g[2], at[0], at[1]); }

  // trains: the number in a box over the block
  for (const tr of state.tr || []) {
    const t = byId.get(tr[2]);
    if (!t) continue;
    const pts = pixels.get(t[0]);
    let total = 0;
    const lens = [];
    for (let i = 0; i + 1 < pts.length; i++) { const l = Math.hypot(pts[i + 1][0] - pts[i][0], pts[i + 1][1] - pts[i][1]); lens.push(l); total += l; }
    let want = total * clamp(tr[3], 0, 1), at = pts[0];
    for (let i = 0; i < lens.length; i++) {
      if (want <= lens[i] || i === lens.length - 1) {
        const f = lens[i] > 0 ? Math.min(want / lens[i], 1) : 0;
        at = [pts[i][0] + (pts[i + 1][0] - pts[i][0]) * f, pts[i][1] + (pts[i + 1][1] - pts[i][1]) * f];
        break;
      }
      want -= lens[i];
    }
    const label = ' ' + (tr[1] || tr[0]) + (tr[4] ? ' TRTS ' : ' ');
    const size = clamp(text, 12, 18);
    ctx.font = `${size}px ${MONO}`;
    const w = ctx.measureText(label).width, h = size + 5, y = at[1] - (W / 2 + 13 + h / 2);
    const flash = tr[4] && (Date.now() % 1000) < 500;
    ctx.fillStyle = flash ? '#fff' : '#000';
    ctx.fillRect(at[0] - w / 2, y - h / 2, w, h);
    ctx.lineWidth = 1; ctx.strokeStyle = 'rgb(120,120,120)';
    ctx.strokeRect(at[0] - w / 2 + 0.5, y - h / 2 + 0.5, w - 1, h - 1);
    ctx.fillStyle = flash ? '#000' : tr[4] ? '#fff' : YEL;
    ctx.textAlign = 'center';
    ctx.fillText(label, at[0], y + 1);
  }
}

const $ = (id) => document.getElementById(id);

function showStatus() {
  const s = $('status');
  if (!code) { s.textContent = ''; return; }
  const since = (Date.now() - lastOk) / 1000 + age / 1000;
  s.className = since > 12 ? 'lost' : since > 4 ? 'late' : '';
  s.textContent = !lastOk ? 'Connecting...' : since > 12 ? 'No update for ' + Math.round(since) + ' s: the signaller may have left the desk' : since > 4 ? 'Last update ' + Math.round(since) + ' s ago' : 'Live';
}

// one update for this desk, however it came
function take(d) {
  if (!d || d.ok === false) {
    if (!plan) { $('err').textContent = 'No desk has that code right now. Check it, and that the signaller is still at the desk.'; }
    return false;
  }
  if (d.plan) { plan = d.plan; rev = d.rev; }
  if (plan) {
    state = d.state; age = d.age || 0; lastOk = Date.now();
    $('name').textContent = d.name || 'Signal box';
    $('by').textContent = d.by ? 'worked by ' + d.by : '';
    $('ask').classList.add('hidden');
    $('other').classList.remove('hidden');
    $('err').textContent = '';
    document.title = (d.name || 'Signal box') + ' · RWU';
  }
  return true;
}

// The server pushes updates over a WebSocket when it can (the Cloudflare Worker does). While there is
// no open socket the page asks once a second instead (the Node version of the server only answers that).
let socket = null, live = false, retry = null;
function listen() {
  clearTimeout(retry);
  if (!code || socket) return;
  const forCode = code;
  let ws;
  try {
    ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws/' + encodeURIComponent(code));
  } catch {
    return;
  }
  socket = ws;
  ws.onopen = () => { live = true; clearTimeout(timer); };
  ws.onmessage = (e) => {
    if (forCode !== code) return;
    try { take(JSON.parse(e.data)); } catch { /* not for us */ }
    showStatus();
    draw();
  };
  ws.onclose = () => {
    if (socket === ws) { socket = null; live = false; }
    if (forCode === code) { poll(); retry = setTimeout(listen, 5000); }
  };
  ws.onerror = () => { try { ws.close(); } catch { /* closed */ } };
}
function hangUp() {
  clearTimeout(retry);
  const ws = socket;
  socket = null; live = false;
  if (ws) { ws.onclose = null; try { ws.close(); } catch { /* closed */ } }
}

async function poll() {
  clearTimeout(timer);
  if (!code || live) return;
  let next = 1000;
  try {
    const res = await fetch('/signalbox/' + encodeURIComponent(code) + '?rev=' + rev, { cache: 'no-store' });
    if (res.status === 404) {
      next = 3000;
      take(null);
    } else if (res.ok) {
      take(await res.json());
    } else {
      next = 3000;
    }
  } catch {
    next = 3000;
  }
  showStatus();
  draw();
  if (!live) timer = setTimeout(poll, next);
}

function start(c) {
  code = c.trim().toUpperCase();
  plan = null; state = null; rev = -1; lastOk = 0;
  $('err').textContent = '';
  history.replaceState(null, '', code ? '#' + code : location.pathname);
  hangUp();
  poll();
  listen();
}

$('form').addEventListener('submit', (e) => { e.preventDefault(); start($('code').value); });
$('other').addEventListener('click', () => {
  clearTimeout(timer);
  hangUp();
  code = ''; plan = null; state = null;
  $('ask').classList.remove('hidden'); $('other').classList.add('hidden');
  $('name').textContent = 'RWU signal panel'; $('by').textContent = '';
  history.replaceState(null, '', location.pathname);
  showStatus(); draw();
});
window.addEventListener('resize', draw);
setInterval(() => { showStatus(); if (state && (state.tr || []).some((t) => t[4])) draw(); }, 500);
if (location.hash.length > 1) { $('code').value = location.hash.slice(1); start(location.hash.slice(1)); }
</script>
</body>
</html>
