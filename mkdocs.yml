site_name: Rail Works Universe Wiki
site_description: Stations, routes, trains and a network map for Rail Works Universe (RWU), a railway game on Roblox.
site_url: https://wsiq838.github.io/rwu-wiki/
repo_url: https://github.com/WSIQ838/rwu-wiki
repo_name: WSIQ838/rwu-wiki
edit_uri: edit/main/docs/
theme:
  name: material
  palette:
  - scheme: slate
    primary: indigo
    accent: pink
    toggle:
      icon: material/weather-sunny
      name: Light mode
  - scheme: default
    primary: indigo
    accent: pink
    toggle:
      icon: material/weather-night
      name: Dark mode
  features:
  - navigation.tabs
  - navigation.indexes
  - navigation.top
  - search.suggest
  - search.highlight
  - content.action.edit
markdown_extensions:
- attr_list
- md_in_html
- tables
- toc:
    permalink: true
